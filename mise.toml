# Tool and task management for lodeframe.
#
# `mise run check` is the canonical verification entry point; CI runs the same
# tasks. The MSRV build (`rust-version` in Cargo.toml) is checked separately in CI.

[tools]
rust = { version = "1.95", components = "rustfmt,clippy", profile = "minimal" }

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks."lint:license"]
description = "Every .rs file starts with the SPDX header (trybuild fixtures excepted)"
run = '''
header='// SPDX-License-Identifier: Apache-2.0 OR MIT'
missing=0
for f in $(git ls-files '*.rs' | grep -v '/tests/ui/'); do
  [ "$(head -n1 "$f")" = "$header" ] || { echo "missing SPDX header: $f"; missing=1; }
done
exit $missing
'''

[tasks.clippy]
description = "Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Workspace test suite"
run = "cargo test --workspace"

[tasks.check]
description = "Full verification (fmt + license + clippy + test)"
depends = ["fmt", "lint:license", "clippy", "test"]

[tasks.msrv]
description = "Build the workspace on the MSRV declared in Cargo.toml"
run = '''
v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
mise exec "rust@$v" -- cargo build --workspace
'''
