[package]
name = "lodeframe"
description = "A minimal, lightweight Minecraft: Java Edition server library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# the headless test harness, `lodeframe::test_util`
test-util = ["tokio/test-util"]

[dependencies]
lodeframe-text.workspace = true
lodeframe-protocol.workspace = true
lodeframe-macros.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
# bots drive a real server in the integration tests; the bot depends on protocol only
lodeframe-bot.workspace = true
# the crate's own tests use the harness
lodeframe = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
trybuild.workspace = true
